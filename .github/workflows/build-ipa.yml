name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Native iOS Project
        run: |
          mkdir -p AppSource
          
          # Tự động tìm file html trong kho chứa và đổi tên chuẩn thành index.html
          HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "Không tìm thấy file HTML!"
            exit 1
          fi
          cp "$HTML_FILE" AppSource/index.html

          # Tạo mã nguồn Swift mở giao diện Full-screen WKWebView chuẩn iOS
          cat << 'EOF' > AppSource/App.swift
          import SwiftUI
          import WebKit

          class FullScreenWKWebView: WKWebView {
              override var safeAreaInsets: UIEdgeInsets {
                  return .zero
              }
          }

          struct WebViewContainer: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.preferences.javaScriptEnabled = true
                  config.websiteDataStore = .default()
                  
                  let webView = FullScreenWKWebView(frame: .zero, configuration: config)
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.bounces = false
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.98, green: 0.96, blue: 0.94, alpha: 1.0)
                  
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct LEclatStudioApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebViewContainer()
                          .ignoresSafeArea(.all)
                          .preferredColorScheme(.light)
                  }
              }
          }
          EOF

          # Tạo cấu hình XcodeGen không cần chứng chỉ Apple
          cat << 'EOF' > project.yml
          name: LEclatStudio
          options:
            bundleIdPrefix: com.kent
            deploymentTarget:
              iOS: "15.0"
          targets:
            LEclatStudio:
              type: application
              platform: iOS
              sources:
                - path: AppSource
                  excludes:
                    - "*.html"
              resources:
                - path: AppSource/index.html
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kent.leclatstudio
                  INFOPLIST_KEY_CFBundleDisplayName: "L'Éclat Studio"
                  INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          xcodegen generate

      - name: Build Unsigned .app via Xcode
        run: |
          xcodebuild -project LEclatStudio.xcodeproj \
            -scheme LEclatStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "LEclatStudio.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r LEclat-Studio-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEclat-Studio-IPA
          path: LEclat-Studio-Unsigned.ipa
