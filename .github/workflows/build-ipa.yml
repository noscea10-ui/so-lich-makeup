              const STORAGE_KEY = 'kimngan_studio_appointments_v1';
              const SETTINGS_KEY = 'kimngan_studio_settings_v1';
              const THEME_KEY = 'kimngan_studio_theme_v1';
              let appointments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
              let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"enableExactTime":true,"remindBeforeMinutes":30,"enableDailySummary":true,"summaryTime":"21:00"}');
              if (typeof settings.enableExactTime === 'undefined') settings.enableExactTime = true;
              let isDark = localStorage.getItem(THEME_KEY) === 'dark';
              let currentFilter = 'upcoming';
              let selectedService = 'Makeup';
              let selectedLocation = 'studio';
              let currentPhotoBase64 = '';
              let firedInAppIds = {};
              const nowObj = new Date();
              let viewYear = nowObj.getFullYear();
              let viewMonth = nowObj.getMonth();
              let selectedDateStr = toDateStr(nowObj);
              function showToast(msg) {
