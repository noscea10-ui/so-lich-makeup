name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Capacitor iOS Project
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp "index.html" www/index.html
          elif [ -f "index (1).html" ]; then
            cp "index (1).html" www/index.html
          else
            HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
            cp "$HTML_FILE" www/index.html
          fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init "LEclat Studio" "com.kent.leclatstudio" --web-dir www
          npx cap add ios

      - name: Build Unsigned Archive via Xcode
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r LEclat-Studio-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEclat-Studio-IPA
          path: LEclat-Studio-Unsigned.ipa
