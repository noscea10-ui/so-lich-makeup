name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Native iOS Project
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          mkdir -p AppSource
          
          HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "Khong tim thay file HTML!"
            exit 1
          fi
          cp "$HTML_FILE" AppSource/index.html

          cat << 'EOF' > AppSource/App.swift
          import SwiftUI
          import WebKit

          class WebCoordinator: NSObject, WKUIDelegate, WKNavigationDelegate {
              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let alert = UIAlertController(title: "L'Éclat Studio", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "OK", style: .default) { _ in completionHandler() })
                  topViewController()?.present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let alert = UIAlertController(title: "Xác nhận", message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "Hủy", style: .cancel) { _ in completionHandler(false) })
                  alert.addAction(UIAlertAction(title: "Đồng ý", style: .default) { _ in completionHandler(true) })
                  topViewController()?.present(alert, animated: true)
              }

              private func topViewController() -> UIViewController? {
                  UIApplication.shared.connectedScenes
                      .compactMap { $0 as? UIWindowScene }
                      .flatMap { $0.windows }
                      .first { $0.isKeyWindow }?
                      .rootViewController
              }
          }

          struct WebViewContainer: UIViewRepresentable {
              func makeCoordinator() -> WebCoordinator {
                  WebCoordinator()
              }

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.defaultWebpagePreferences.allowsContentJavaScript = true
                  config.websiteDataStore = .default()
                  config.preferences.setValue(true, forKey: "allowFileAccessFromFileURLs")

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.uiDelegate = context.coordinator
                  webView.navigationDelegate = context.coordinator
                  webView.scrollView.bounces = false
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.98, green: 0.96, blue: 0.94, alpha: 1.0)

                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  } else {
                      webView.loadHTMLString("<h2 style='padding:40px;font-family:sans-serif'>Không tìm thấy file index.html trong gói ứng dụng</h2>", baseURL: nil)
                  }
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct LEclatStudioApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebViewContainer()
                          .ignoresSafeArea(.container, edges: .bottom)
                          .background(Color(red: 0.98, green: 0.96, blue: 0.94).ignoresSafeArea())
                          .preferredColorScheme(.light)
                  }
              }
          }
          EOF

          cat << 'EOF' > project.yml
          name: LEclatStudio
          options:
            bundleIdPrefix: com.kent
            deploymentTarget:
              iOS: "15.0"
          targets:
            LEclatStudio:
              type: application
              platform: iOS
              sources:
                - path: AppSource
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kent.leclatstudio
                  INFOPLIST_KEY_CFBundleDisplayName: "LEclat Studio"
                  INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Cho phep chon anh khach hang va mau nail makeup"
                  INFOPLIST_KEY_NSCameraUsageDescription: "Cho phep chup anh khach hang va mau nail makeup"
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          xcodegen generate

      - name: Build Unsigned .app via Xcode
        run: |
          xcodebuild -project LEclatStudio.xcodeproj \
            -scheme LEclatStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "LEclatStudio.app" -type d | head -n 1)
          if [ ! -f "$APP_PATH/index.html" ]; then
            echo "LOI: index.html chua duoc dong goi vao trong .app!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r LEclat-Studio-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEclat-Studio-IPA
          path: LEclat-Studio-Unsigned.ipa
