name: Build Kim Ngan Studio IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen || (
              curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o xcodegen.zip &&
              unzip -q xcodegen.zip &&
              sudo mkdir -p /usr/local/bin &&
              sudo cp xcodegen/bin/xcodegen /usr/local/bin/xcodegen
            )
          fi

      - name: Prepare Cover Image & App Icon (Native macOS)
        run: |
          mkdir -p AppSource
          mkdir -p Assets.xcassets/AppIcon.appiconset

          swift - << 'SWIFTEOF'
          import AppKit

          let fm = FileManager.default
          let files = (try? fm.contentsOfDirectory(atPath: ".")) ?? []
          let imgExts = ["png", "jpg", "jpeg"]
          let candidates = files.filter { f in
              let ext = (f as NSString).pathExtension.lowercased()
              return imgExts.contains(ext) && !f.hasPrefix(".")
          }

          let chosen = candidates.contains("cover.png") ? "cover.png" : candidates.first

          func savePNG(_ image: NSImage, to path: String, pixelWidth: Int, pixelHeight: Int) {
              guard let rep = NSBitmapImageRep(
                  bitmapDataPlanes: nil,
                  pixelsWide: pixelWidth,
                  pixelsHigh: pixelHeight,
                  bitsPerSample: 8,
                  samplesPerPixel: 4,
                  hasAlpha: true,
                  isPlanar: false,
                  colorSpaceName: .deviceRGB,
                  bytesPerRow: 0,
                  bitsPerPixel: 0
              ) else { return }
              rep.size = NSSize(width: pixelWidth, height: pixelHeight)
              NSGraphicsContext.saveGraphicsState()
              NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
              NSGraphicsContext.current?.imageInterpolation = .high
              image.draw(in: NSRect(x: 0, y: 0, width: pixelWidth, height: pixelHeight),
                         from: NSRect(origin: .zero, size: image.size),
                         operation: .copy,
                         fraction: 1.0)
              NSGraphicsContext.restoreGraphicsState()
              if let data = rep.representation(using: .png, properties: [:]) {
                  try? data.write(to: URL(fileURLWithPath: path))
              }
          }

          if let srcName = chosen, let srcImage = NSImage(contentsOfFile: srcName),
             let tiff = srcImage.tiffRepresentation, let bitmap = NSBitmapImageRep(data: tiff) {
              let w = bitmap.pixelsWide
              let h = bitmap.pixelsHigh
              let size = NSSize(width: w, height: h)

              // 1. Xoá logo CapCut ở góc trên bên phải bằng vùng nền lân cận
              let cleaned = NSImage(size: size)
              cleaned.lockFocus()
              srcImage.draw(in: NSRect(origin: .zero, size: size))

              let wmX = CGFloat(w) * 0.68
              let wmW = CGFloat(w) - wmX
              let wmY = CGFloat(h) * 0.92
              let wmH = CGFloat(h) - wmY

              let sampleRect = NSRect(x: max(0, wmX - wmW), y: wmY, width: wmW, height: wmH)
              let targetRect = NSRect(x: wmX, y: wmY, width: wmW, height: wmH)
              srcImage.draw(in: targetRect, from: sampleRect, operation: .copy, fraction: 1.0)
              cleaned.unlockFocus()

              savePNG(cleaned, to: "AppSource/cover.png", pixelWidth: w, pixelHeight: h)

              // 2. Cắt vuông trung tâm khuôn mặt làm Icon App 1024x1024
              let side = min(w, h)
              let cropX = (w - side) / 2
              let cropY = Int(Double(h - side) * 0.78)
              let iconImg = NSImage(size: NSSize(width: 1024, height: 1024))
              iconImg.lockFocus()
              cleaned.draw(in: NSRect(x: 0, y: 0, width: 1024, height: 1024),
                           from: NSRect(x: cropX, y: cropY, width: side, height: side),
                           operation: .copy,
                           fraction: 1.0)
              iconImg.unlockFocus()

              savePNG(iconImg, to: "Assets.xcassets/AppIcon.appiconset/icon_1024.png", pixelWidth: 1024, pixelHeight: 1024)
              print("Da xu ly xong anh bia & icon tu: \(srcName)")
          } else {
              let fallback = NSImage(size: NSSize(width: 1024, height: 1024))
              fallback.lockFocus()
              NSColor(red: 0.14, green: 0.10, blue: 0.09, alpha: 1.0).setFill()
              NSRect(x: 0, y: 0, width: 1024, height: 1024).fill()
              fallback.unlockFocus()
              savePNG(fallback, to: "AppSource/cover.png", pixelWidth: 1024, pixelHeight: 1024)
              savePNG(fallback, to: "Assets.xcassets/AppIcon.appiconset/icon_1024.png", pixelWidth: 1024, pixelHeight: 1024)
              print("Tao anh bia & icon mac dinh")
          }
          SWIFTEOF

          cat << 'EOF' > Assets.xcassets/Contents.json
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cat << 'EOF' > Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "icon_1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Generate Native iOS Project
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "Khong tim thay file index.html!"
            exit 1
          fi
          cp "$HTML_FILE" AppSource/index.html

          cat << 'EOF' > AppSource/App.swift
          import SwiftUI
          import WebKit
          import UserNotifications

          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  let center = UNUserNotificationCenter.current()
                  center.delegate = self
                  center.requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
                  return true
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                          willPresent notification: UNNotification,
                                          withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  completionHandler([.banner, .sound, .list])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                          didReceive response: UNNotificationResponse,
                                          withCompletionHandler completionHandler: @escaping () -> Void) {
                  completionHandler()
              }
          }

          class NotificationBridge: NSObject, WKScriptMessageHandler {
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let dict = message.body as? [String: Any],
                        let action = dict["action"] as? String else { return }

                  if action == "testNotification" {
                      scheduleTestBanner()
                  } else if action == "syncNotifications" {
                      syncAllAppointments(dict)
                  }
              }

              private func scheduleTestBanner() {
                  let content = UNMutableNotificationContent()
                  content.title = "⏰ Kim Ngân Studio • Nhắc lịch hẹn"
                  content.body = "30 phút nữa (09:00): Chị Thảo — Makeup (Khách chị Lan giới thiệu)"
                  content.sound = .default

                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: 5, repeats: false)
                  let req = UNNotificationRequest(identifier: "test-banner-\(UUID().uuidString)", content: content, trigger: trigger)
                  UNUserNotificationCenter.current().add(req)
              }

              private func syncAllAppointments(_ dict: [String: Any]) {
                  let center = UNUserNotificationCenter.current()
                  center.removeAllPendingNotificationRequests()

                  guard let list = dict["appointments"] as? [[String: Any]] else { return }
                  let summaryHour = dict["dailySummaryHour"] as? Int ?? 21
                  let summaryMinute = dict["dailySummaryMinute"] as? Int ?? 0
                  let remindBefore = dict["remindBeforeMinutes"] as? Int ?? 30
                  let enableSummary = dict["enableDailySummary"] as? Bool ?? true

                  let posixLocale = Locale(identifier: "en_US_POSIX")

                  let formatter = DateFormatter()
                  formatter.locale = posixLocale
                  formatter.dateFormat = "yyyy-MM-dd HH:mm"
                  formatter.timeZone = TimeZone.current

                  let dayFormatter = DateFormatter()
                  dayFormatter.locale = posixLocale
                  dayFormatter.dateFormat = "yyyy-MM-dd"
                  dayFormatter.timeZone = TimeZone.current

                  let calendar = Calendar.current
                  let now = Date()
                  var groupedByDate: [String: [[String: Any]]] = [:]

                  for item in list {
                      guard let id = item["id"] as? String,
                            let dateStr = item["date"] as? String,
                            let timeStr = item["time"] as? String,
                            let name = item["customerName"] as? String,
                            let service = item["service"] as? String else { continue }
                      let note = item["note"] as? String ?? ""

                      groupedByDate[dateStr, default: []].append(item)

                      if remindBefore > 0,
                         let aptDate = formatter.date(from: "\(dateStr) \(timeStr)"),
                         let triggerDate = calendar.date(byAdding: .minute, value: -remindBefore, to: aptDate),
                         triggerDate > now {
                          let comps = calendar.dateComponents([.year, .month, .day, .hour, .minute], from: triggerDate)
                          let content = UNMutableNotificationContent()
                          content.title = "⏰ \(remindBefore) phút nữa có khách (\(timeStr))"
                          content.body = "\(name) • \(service)" + (note.isEmpty ? "" : " — \(note)")
                          content.sound = .default

                          let trigger = UNCalendarNotificationTrigger(dateMatching: comps, repeats: false)
                          let req = UNNotificationRequest(identifier: "apt-remind-\(id)", content: content, trigger: trigger)
                          center.add(req)
                      }
                  }

                  if enableSummary {
                      for (dateStr, items) in groupedByDate {
                          guard let targetDay = dayFormatter.date(from: dateStr),
                                let eveningBefore = calendar.date(byAdding: .day, value: -1, to: targetDay) else { continue }

                          var comps = calendar.dateComponents([.year, .month, .day], from: eveningBefore)
                          comps.hour = summaryHour
                          comps.minute = summaryMinute

                          if let fireDate = calendar.date(from: comps), fireDate > now {
                              let sorted = items.sorted { ($0["time"] as? String ?? "") < ($1["time"] as? String ?? "") }
                              let lines = sorted.map { "\($0["time"] ?? "") • \($0["customerName"] ?? "") (\($0["service"] ?? ""))" }

                              let content = UNMutableNotificationContent()
                              content.title = "📅 Ngày mai có \(items.count) khách đặt lịch"
                              content.body = lines.joined(separator: "\n")
                              content.sound = .default

                              let trigger = UNCalendarNotificationTrigger(dateMatching: comps, repeats: false)
                              let req = UNNotificationRequest(identifier: "summary-\(dateStr)", content: content, trigger: trigger)
                              center.add(req)
                          }
                      }
                  }
              }
          }

          struct WebViewContainer: UIViewRepresentable {
              func makeCoordinator() -> NotificationBridge {
                  NotificationBridge()
              }

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.defaultWebpagePreferences.allowsContentJavaScript = true
                  config.websiteDataStore = .default()
                  config.preferences.setValue(true, forKey: "allowFileAccessFromFileURLs")
                  config.userContentController.add(context.coordinator, name: "iosNotify")

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.scrollView.bounces = false
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.98, green: 0.96, blue: 0.95, alpha: 1.0)

                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct KimNganStudioApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate

              var body: some Scene {
                  WindowGroup {
                      WebViewContainer()
                          .ignoresSafeArea(.all)
                          .preferredColorScheme(.light)
                  }
              }
          }
          EOF

          cat << 'EOF' > project.yml
          name: KimNganStudio
          options:
            bundleIdPrefix: com.kent
            deploymentTarget:
              iOS: "15.0"
          targets:
            KimNganStudio:
              type: application
              platform: iOS
              sources:
                - path: AppSource
                - path: Assets.xcassets
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kent.kimnganstudio
                  INFOPLIST_KEY_CFBundleDisplayName: "Kim Ngân Studio"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Cho phep chon anh khach hang va mau nail makeup"
                  INFOPLIST_KEY_NSCameraUsageDescription: "Cho phep chup anh khach hang va mau nail makeup"
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          xcodegen generate

      - name: Build Unsigned .app via Xcode
        run: |
          xcodebuild -project KimNganStudio.xcodeproj \
            -scheme KimNganStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "KimNganStudio.app" -type d | head -n 1)
          if [ ! -f "$APP_PATH/index.html" ]; then
            echo "LOI: Khong tim thay index.html trong goi ung dung!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r KimNganStudio-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KimNganStudio-IPA
          path: KimNganStudio-Unsigned.ipa
