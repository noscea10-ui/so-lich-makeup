<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kim Ngân Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF5F2;
      --bg-card: #FFFFFF;
      --bg-subtle: #F4ECE7;
      --espresso: #231917;
      --espresso-soft: #5A4742;
      --rose: #C86D77;
      --rose-light: #F9E8EA;
      --gold: #B88A44;
      --gold-light: #FBF3E4;
      --border: #EAE0DA;
      --text-muted: #8C7A75;
      --nav-bg: rgba(255, 255, 255, 0.92);
      --shadow-card: 0 6px 20px rgba(35, 25, 23, 0.04);
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 24px);
    }

    body.dark-mode {
      --bg-cream: #120E0D;
      --bg-card: #1C1615;
      --bg-subtle: #261E1C;
      --espresso: #F6EFEA;
      --espresso-soft: #CBBAB4;
      --rose: #E28590;
      --rose-light: rgba(226, 133, 144, 0.16);
      --gold: #E0B66E;
      --gold-light: rgba(224, 182, 110, 0.16);
      --border: #2E2421;
      --text-muted: #968580;
      --nav-bg: rgba(24, 19, 18, 0.92);
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-cream);
      color: var(--espresso);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(88px + var(--safe-bottom));
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ================= SPLASH COVER & ANIMATION ================= */
    @keyframes kenBurns {
      0% { transform: scale(1) translate3d(0, 0, 0); }
      100% { transform: scale(1.08) translate3d(0, -1%, 0); }
    }

    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmerSweep {
      0% { left: -100%; }
      60% { left: 140%; }
      100% { left: 140%; }
    }

    #cover-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 25%, #5C3A3E 0%, #231715 65%, #120B0A 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #cover-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.04);
    }

    #cover-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      animation: kenBurns 14s ease-in-out infinite alternate;
    }

    .cover-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(18, 12, 11, 0.38) 0%,
        rgba(18, 12, 11, 0.15) 38%,
        rgba(18, 12, 11, 0.85) 78%,
        rgba(14, 9, 8, 0.97) 100%
      );
    }

    .cover-top-crest {
      position: relative;
      z-index: 2;
      padding-top: calc(24px + var(--safe-top));
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.7s ease-out both;
    }

    .logo-emblem-wrap {
      position: relative;
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .logo-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px dashed rgba(235, 195, 130, 0.75);
      animation: spinSlow 22s linear infinite;
    }

    .logo-ring-inner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(24, 16, 15, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(235, 195, 130, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: #F3D19B;
      letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .cover-content {
      position: relative;
      z-index: 2;
      padding: 24px 22px calc(32px + var(--safe-bottom));
      color: #FFF;
      text-align: center;
      animation: fadeUp 0.85s ease-out 0.12s both;
    }

    .cover-glass-box {
      background: rgba(26, 18, 17, 0.58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .cover-badge {
      display: inline-block;
      padding: 5px 13px;
      border-radius: 999px;
      background: rgba(229, 185, 115, 0.18);
      border: 1px solid rgba(229, 185, 115, 0.4);
      color: #F3D19B;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .cover-title {
      font-family: 'Playfair Display', serif;
      font-size: 31px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
      color: #FFFDFB;
    }

    .cover-summary {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.86);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .btn-enter {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #ECC482 0%, #C79244 100%);
      color: #1C1210;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(199, 146, 68, 0.35);
    }

    .btn-enter::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-22deg);
      animation: shimmerSweep 3.5s infinite;
    }

    /* ================= HEADER ================= */
    .app-header {
      padding: calc(12px + var(--safe-top)) 18px 12px;
      background: var(--bg-cream);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.25s ease;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-crest {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, #2D1E1B, #59383C);
      border: 1px solid rgba(229, 185, 115, 0.5);
      color: #F3D19B;
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--espresso);
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--espresso);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .container {
      padding: 16px 16px 24px;
      max-width: 540px;
      margin: 0 auto;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeUp 0.28s ease-out;
    }

    /* ================= CALENDAR ================= */
    .calendar-card {
      background: var(--bg-card);
      border-radius: 22px;
      padding: 15px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      margin-bottom: 18px;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .cal-month-label {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .cal-nav-group {
      display: flex;
      gap: 6px;
    }

    .cal-btn {
      padding: 6px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--espresso);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-cell {
      min-height: 58px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--bg-subtle);
      padding: 5px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .day-cell:active {
      transform: scale(0.95);
    }

    .day-cell.empty {
      background: transparent;
      cursor: default;
    }

    .day-cell.today {
      border-color: var(--rose);
    }

    .day-cell.selected {
      background: var(--espresso);
      color: var(--bg-cream);
      border-color: var(--espresso);
    }

    .day-num {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .day-pills {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      align-items: center;
    }

    .mini-time {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 5px;
      width: 92%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-time.makeup {
      background: var(--rose-light);
      color: var(--rose);
    }

    .mini-time.nail {
      background: var(--gold-light);
      color: var(--gold);
    }

    .day-cell.selected .mini-time.makeup {
      background: var(--rose);
      color: #FFF;
    }

    .day-cell.selected .mini-time.nail {
      background: var(--gold);
      color: #1A1210;
    }

    .more-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .day-cell.selected .more-badge {
      color: var(--gold);
    }

    /* ================= APPOINTMENTS LIST ================= */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 15.5px;
      font-weight: 700;
    }

    .count-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--rose-light);
      color: var(--rose);
    }

    .apt-card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 14px 15px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      box-shadow: var(--shadow-card);
    }

    .apt-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .time-badge {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--espresso);
      background: var(--bg-subtle);
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .live-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--gold-light);
      color: var(--gold);
    }

    .service-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .service-tag.makeup {
      background: var(--rose-light);
      color: var(--rose);
    }

    .service-tag.nail {
      background: var(--gold-light);
      color: var(--gold);
    }

    .service-tag.combo {
      background: rgba(155, 114, 207, 0.16);
      color: #9B72CF;
    }

    .apt-body {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .apt-photo {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      cursor: zoom-in;
    }

    .apt-info {
      flex: 1;
      min-width: 0;
    }

    .customer-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--espresso);
    }

    .apt-note {
      font-size: 13px;
      color: var(--espresso-soft);
      line-height: 1.45;
      background: var(--bg-subtle);
      padding: 7px 10px;
      border-radius: 10px;
      margin-top: 4px;
    }

    .apt-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .btn-mini {
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      font-size: 12px;
      font-weight: 600;
      color: var(--espresso-soft);
      cursor: pointer;
    }

    .btn-mini.danger {
      color: #E05252;
      border-color: rgba(224, 82, 82, 0.3);
      background: rgba(224, 82, 82, 0.08);
    }

    .gap-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin: -3px 0 7px;
    }

    .gap-indicator.warn {
      color: #E05252;
      background: rgba(224, 82, 82, 0.12);
      padding: 5px 10px;
      border-radius: 9px;
      margin: 2px 0 8px;
    }

    /* ================= ALL LIST & SEARCH ================= */
    .search-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--espresso);
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .filter-chip {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 12px;
      font-weight: 600;
      color: var(--espresso-soft);
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--espresso);
      color: var(--bg-cream);
      border-color: var(--espresso);
    }

    .date-group-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--rose);
      margin: 14px 0 8px;
      text-transform: capitalize;
    }

    /* ================= NOTIFICATIONS TAB ================= */
    .status-banner {
      background: var(--gold-light);
      border: 1px solid rgba(224, 182, 110, 0.35);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: var(--espresso);
    }

    .setting-card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .setting-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    select.styled-select, input[type="time"].styled-input {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      font-size: 14px;
      font-weight: 600;
      color: var(--espresso);
    }

    .btn-primary-full {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--espresso);
      color: var(--bg-cream);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* ================= BOTTOM NAV ================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 12px calc(8px + var(--safe-bottom));
      z-index: 80;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--espresso);
      font-weight: 700;
    }

    .nav-icon {
      font-size: 19px;
    }

    .fab-add {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #D9737E 0%, #A94B56 100%);
      color: #FFF;
      font-size: 26px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(200, 109, 119, 0.38);
      cursor: pointer;
      margin-top: -18px;
    }

    /* ================= MODAL & LIGHTBOX ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 8, 8, 0.65);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg-card);
      color: var(--espresso);
      width: 100%;
      max-width: 540px;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(24px + var(--safe-bottom));
      max-height: 92vh;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--espresso-soft);
    }

    .form-control {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      font-size: 14px;
      font-family: inherit;
      color: var(--espresso);
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-times {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-top: 6px;
    }

    .q-time-btn {
      padding: 5px 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--espresso-soft);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .overlap-alert {
      display: none;
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(224, 82, 82, 0.14);
      color: #E05252;
      font-size: 12px;
      font-weight: 600;
    }

    .service-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .srv-opt {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .srv-opt.selected {
      background: var(--espresso);
      color: var(--bg-cream);
      border-color: var(--espresso);
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px dashed var(--border);
    }

    #photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #photo-lightbox.open {
      display: flex;
    }

    #photo-lightbox img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <!-- Màn hình ảnh bìa & hiệu ứng Logo mở app -->
  <div id="cover-screen">
    <img id="cover-img" src="./cover.png" alt="Kim Ngân Studio" onerror="this.style.display='none'" />
    <div class="cover-gradient"></div>

    <div class="cover-top-crest">
      <div class="logo-emblem-wrap">
        <div class="logo-ring-outer"></div>
        <div class="logo-ring-inner">KN</div>
      </div>
    </div>

    <div class="cover-content">
      <div class="cover-glass-box">
        <div class="cover-badge">Sổ Lịch Makeup &amp; Nail</div>
        <h1 class="cover-title">Kim Ngân Studio</h1>
        <p class="cover-summary" id="cover-today-summary">Đang kiểm tra lịch hẹn hôm nay...</p>
        <button class="btn-enter" onclick="closeCover()">Mở Sổ Lịch</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-row">
      <div class="mini-crest">KN</div>
      <div>
        <div class="brand-title">Kim Ngân Studio</div>
        <div class="brand-sub" id="header-date-sub">Hôm nay</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle-btn" title="Đổi nền sáng / tối" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" title="Xem ảnh bìa" onclick="openCover()">🖼️</button>
    </div>
  </header>

  <main class="container">
    <!-- TAB 1: LỊCH THÁNG -->
    <section id="tab-calendar" class="tab-panel active">
      <div class="calendar-card">
        <div class="cal-nav">
          <div class="cal-month-label" id="cal-month-label">Tháng 11, 2026</div>
          <div class="cal-nav-group">
            <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
            <button class="cal-btn" onclick="goToday()">Hôm nay</button>
            <button class="cal-btn" onclick="changeMonth(1)">›</button>
          </div>
        </div>
        <div class="weekdays">
          <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
        </div>
        <div class="days-grid" id="days-grid"></div>
      </div>

      <div class="section-header">
        <div class="section-title" id="selected-day-title">Lịch ngày đang chọn</div>
        <div class="count-pill" id="selected-day-count">0 khách</div>
      </div>
      <div id="day-appointments-list"></div>
    </section>

    <!-- TAB 2: TỔNG LỊCH ĐẶT -->
    <section id="tab-all" class="tab-panel">
      <input type="text" id="search-input" class="search-box" placeholder="Tìm tên khách hoặc ghi chú..." oninput="renderAllList()" />
      <div class="filter-row">
        <button class="filter-chip active" data-filter="upcoming" onclick="setFilter('upcoming', this)">Sắp tới &amp; Hôm nay</button>
        <button class="filter-chip" data-filter="all" onclick="setFilter('all', this)">Tất cả</button>
        <button class="filter-chip" data-filter="Makeup" onclick="setFilter('Makeup', this)">Makeup</button>
        <button class="filter-chip" data-filter="Nail" onclick="setFilter('Nail', this)">Nail</button>
        <button class="filter-chip" data-filter="past" onclick="setFilter('past', this)">Đã qua</button>
      </div>
      <div id="all-appointments-list"></div>
    </section>

    <!-- TAB 3: THÔNG BÁO IPHONE -->
    <section id="tab-notify" class="tab-panel">
      <div class="status-banner">
        <span>📲 Thông báo chạy nền trên iPhone</span>
        <span id="ios-pending-badge">Đang đồng bộ...</span>
      </div>

      <div class="setting-card">
        <div class="setting-row">
          <div>
            <div class="setting-title">Báo đúng giờ hẹn khách</div>
            <div class="setting-desc">Ví dụ khách đặt 17:30 thì đúng 17:30 iPhone bật popup báo ngay</div>
          </div>
          <input type="checkbox" id="enable-exact" checked onchange="saveSettings()" style="width:20px;height:20px;accent-color:#C86D77;" />
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-row">
          <div>
            <div class="setting-title">Nhắc trước giờ khách đến</div>
            <div class="setting-desc">Báo trước để chuẩn bị đồ (VD: 17:00 nhắc ca 17:30)</div>
          </div>
          <select id="remind-minutes" class="styled-select" onchange="saveSettings()">
            <option value="0">Tắt</option>
            <option value="15">15 phút</option>
            <option value="30" selected>30 phút</option>
            <option value="45">45 phút</option>
            <option value="60">60 phút</option>
          </select>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-row" style="margin-bottom: 12px;">
          <div>
            <div class="setting-title">Báo tổng khách ngày mai</div>
            <div class="setting-desc">Nhắc danh sách khách đặt lịch trước khi qua ngày mới</div>
          </div>
          <input type="checkbox" id="enable-summary" checked onchange="saveSettings()" style="width:20px;height:20px;accent-color:#C86D77;" />
        </div>
        <div class="setting-row">
          <div class="setting-desc">Giờ gửi thông báo buổi tối</div>
          <input type="time" id="summary-time" class="styled-input" value="21:00" onchange="saveSettings()" />
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-row">
          <div>
            <div class="setting-title">Giao diện Nền Tối</div>
            <div class="setting-desc">Dịu mắt khi xem lịch vào buổi tối</div>
          </div>
          <input type="checkbox" id="dark-mode-checkbox" onchange="toggleTheme(this.checked)" style="width:20px;height:20px;accent-color:#C86D77;" />
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-title">Kiểm tra thông báo màn hình khoá</div>
        <div class="setting-desc" style="margin-bottom: 10px;">Bấm nút dưới đây rồi khoá màn hình iPhone lại ngay, sau 5 giây popup sẽ hiện lên.</div>
        <button class="btn-primary-full" onclick="sendTestNotification()">🔔 Gửi thử thông báo (sau 5 giây)</button>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('calendar', this)">
      <span class="nav-icon">📅</span>
      <span>Lịch tháng</span>
    </button>
    <button class="fab-add" onclick="openModal()" title="Thêm lịch mới">+</button>
    <button class="nav-item" onclick="switchTab('all', this)">
      <span class="nav-icon">📋</span>
      <span>Tổng lịch đặt</span>
    </button>
    <button class="nav-item" onclick="switchTab('notify', this)">
      <span class="nav-icon">🔔</span>
      <span>Thông báo</span>
    </button>
  </nav>

  <!-- Modal Thêm / Sửa lịch hẹn -->
  <div class="modal-backdrop" id="apt-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Thêm Lịch Đặt Mới</div>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>

      <input type="hidden" id="edit-id" />

      <div class="form-group">
        <label class="form-label">Tên khách hàng *</label>
        <input type="text" id="inp-name" class="form-control" placeholder="VD: Chị Thảo (Em chị Lan)" />
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label">Ngày đặt *</label>
          <input type="date" id="inp-date" class="form-control" onchange="checkOverlapWarning()" />
        </div>
        <div class="form-group">
          <label class="form-label">Giờ hẹn *</label>
          <input type="time" id="inp-time" class="form-control" value="09:00" onchange="checkOverlapWarning()" />
        </div>
      </div>

      <div class="form-group" style="margin-top:-6px;">
        <div class="quick-times">
          <button type="button" class="q-time-btn" onclick="setQuickTime('08:00')">08:00</button>
          <button type="button" class="q-time-btn" onclick="setQuickTime('09:00')">09:00</button>
          <button type="button" class="q-time-btn" onclick="setQuickTime('10:30')">10:30</button>
          <button type="button" class="q-time-btn" onclick="setQuickTime('13:30')">13:30</button>
          <button type="button" class="q-time-btn" onclick="setQuickTime('15:00')">15:00</button>
          <button type="button" class="q-time-btn" onclick="setQuickTime('17:30')">17:30</button>
          <button type="button" class="q-time-btn" onclick="setQuickTime('19:00')">19:00</button>
        </div>
        <div class="overlap-alert" id="overlap-alert"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Khách làm gì?</label>
        <div class="service-selector">
          <div class="srv-opt selected" data-srv="Makeup" onclick="selectService('Makeup', this)">💄 Makeup</div>
          <div class="srv-opt" data-srv="Nail" onclick="selectService('Nail', this)">💅 Nail</div>
          <div class="srv-opt" data-srv="Makeup & Nail" onclick="selectService('Makeup & Nail', this)">✨ Cả hai</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Ghi chú thêm (Đặc điểm nhận dạng, mẫu, địa điểm...)</label>
        <textarea id="inp-note" class="form-control" rows="2" placeholder="VD: Khách quen giới thiệu, makeup đi tiệc tone cam đào..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Ảnh khách / Ảnh mẫu (Không bắt buộc)</label>
        <input type="file" id="inp-photo" accept="image/*" class="form-control" onchange="handlePhotoUpload(event)" />
        <img id="photo-preview" style="display:none; width:72px; height:72px; object-fit:cover; border-radius:12px; margin-top:8px;" />
      </div>

      <button class="btn-primary-full" onclick="saveAppointment()">Lưu Lịch Hẹn</button>
    </div>
  </div>

  <!-- Lightbox xem ảnh -->
  <div id="photo-lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Phóng to" />
  </div>

  <script>
    const STORAGE_KEY = 'kimngan_studio_appointments_v1';
    const SETTINGS_KEY = 'kimngan_studio_settings_v1';
    const THEME_KEY = 'kimngan_studio_theme_v1';

    let appointments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"enableExactTime":true,"remindBeforeMinutes":30,"enableDailySummary":true,"summaryTime":"21:00"}');
    if (typeof settings.enableExactTime === 'undefined') settings.enableExactTime = true;

    let isDark = localStorage.getItem(THEME_KEY) === 'dark';
    let currentFilter = 'upcoming';
    let selectedService = 'Makeup';
    let currentPhotoBase64 = '';

    const nowObj = new Date();
    let viewYear = nowObj.getFullYear();
    let viewMonth = nowObj.getMonth();
    let selectedDateStr = toDateStr(nowObj);

    function applyTheme(dark) {
      isDark = dark;
      document.body.classList.toggle('dark-mode', isDark);
      document.getElementById('theme-toggle-btn').textContent = isDark ? '☀️' : '🌙';
      const cb = document.getElementById('dark-mode-checkbox');
      if (cb) cb.checked = isDark;
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosNotify) {
        window.webkit.messageHandlers.iosNotify.postMessage({ action: 'setTheme', isDark: isDark });
      }
    }

    function toggleTheme(forceVal) {
      const next = typeof forceVal === 'boolean' ? forceVal : !isDark;
      applyTheme(next);
    }

    function toDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatTimeVi(time24) {
      if (!time24) return '';
      const [hh, mm] = time24.split(':').map(Number);
      let period = 'sáng';
      let h12 = hh;
      if (hh === 12) { period = 'trưa'; }
      else if (hh > 12 && hh < 18) { period = 'chiều'; h12 = hh - 12; }
      else if (hh >= 18) { period = 'tối'; h12 = hh - 12; }
      else if (hh === 0) { period = 'đêm'; h12 = 12; }
      return `${time24} (${h12}h${mm > 0 ? String(mm).padStart(2, '0') : ''} ${period})`;
    }

    function formatDateVi(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
      return `${days[date.getDay()]}, ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
    }

    function closeCover() {
      document.getElementById('cover-screen').classList.add('hidden');
    }

    function openCover() {
      updateCoverSummary();
      document.getElementById('cover-screen').classList.remove('hidden');
    }

    function updateCoverSummary() {
      const todayStr = toDateStr(new Date());
      const todayList = appointments.filter(a => a.date === todayStr).sort((a, b) => a.time.localeCompare(b.time));
      const el = document.getElementById('cover-today-summary');
      if (todayList.length === 0) {
        el.textContent = `Hôm nay (${formatDateVi(todayStr)}) chưa có khách đặt lịch.`;
      } else {
        const preview = todayList.map(a => `${a.time} ${a.customerName}`).join(' • ');
        el.textContent = `Hôm nay có ${todayList.length} khách: ${preview}`;
      }
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');
      if (tab === 'all') renderAllList();
      if (tab === 'notify') syncIosNotifications();
    }

    function changeMonth(delta) {
      viewMonth += delta;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    }

    function goToday() {
      const t = new Date();
      viewYear = t.getFullYear();
      viewMonth = t.getMonth();
      selectedDateStr = toDateStr(t);
      renderCalendar();
      renderDayAppointments();
    }

    function renderCalendar() {
      const monthNames = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
      document.getElementById('cal-month-label').textContent = `${monthNames[viewMonth]}, ${viewYear}`;

      const grid = document.getElementById('days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const offset = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const todayStr = toDateStr(new Date());

      for (let i = 0; i < offset; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayApts = appointments.filter(a => a.date === dateStr).sort((a, b) => a.time.localeCompare(b.time));

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (dateStr === todayStr) cell.classList.add('today');
        if (dateStr === selectedDateStr) cell.classList.add('selected');

        let pillsHtml = '';
        dayApts.slice(0, 2).forEach(a => {
          const cls = a.service.toLowerCase().includes('nail') && !a.service.toLowerCase().includes('makeup') ? 'nail' : 'makeup';
          pillsHtml += `<span class="mini-time ${cls}">${a.time}</span>`;
        });
        if (dayApts.length > 2) {
          pillsHtml += `<span class="more-badge">+${dayApts.length - 2} khách</span>`;
        }

        cell.innerHTML = `<div class="day-num">${d}</div><div class="day-pills">${pillsHtml}</div>`;
        cell.onclick = () => {
          selectedDateStr = dateStr;
          renderCalendar();
          renderDayAppointments();
        };
        grid.appendChild(cell);
      }
    }

    function getMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function getTodayStatusBadge(dateStr, timeStr) {
      const now = new Date();
      if (dateStr !== toDateStr(now)) return '';
      const nowMins = now.getHours() * 60 + now.getMinutes();
      const aptMins = getMinutes(timeStr);
      const diff = aptMins - nowMins;
      if (diff > 0 && diff <= 60) return `<span class="live-badge">Còn ${diff}p nữa</span>`;
      if (diff <= 0 && diff >= -45) return `<span class="live-badge">Đang tới giờ</span>`;
      return '';
    }

    function renderDayAppointments() {
      const todayStr = toDateStr(new Date());
      const prefix = selectedDateStr === todayStr ? 'Hôm nay • ' : '';
      document.getElementById('selected-day-title').textContent = prefix + formatDateVi(selectedDateStr);

      const list = appointments.filter(a => a.date === selectedDateStr).sort((a, b) => a.time.localeCompare(b.time));
      document.getElementById('selected-day-count').textContent = `${list.length} khách`;

      const container = document.getElementById('day-appointments-list');
      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state">Ngày này chưa có lịch hẹn nào.<br/>Bấm nút <strong>+</strong> bên dưới để ghi chú khách đặt lịch.</div>`;
        return;
      }

      let html = '';
      list.forEach((apt, idx) => {
        if (idx > 0) {
          const diff = getMinutes(apt.time) - getMinutes(list[idx - 1].time);
          if (diff < 45) {
            html += `<div class="gap-indicator warn">⚠️ Trùng / Sát giờ với khách trước (${diff} phút)</div>`;
          } else {
            const hrs = Math.floor(diff / 60);
            const mins = diff % 60;
            const gapText = hrs > 0 ? `${hrs} tiếng ${mins > 0 ? mins + ' phút' : ''}` : `${mins} phút`;
            html += `<div class="gap-indicator">↓ Cách ca trước ${gapText}</div>`;
          }
        }
        html += renderCardHtml(apt);
      });
      container.innerHTML = html;
    }

    function renderCardHtml(apt) {
      let srvClass = 'makeup';
      if (apt.service === 'Nail') srvClass = 'nail';
      else if (apt.service.includes('&')) srvClass = 'combo';

      const liveBadge = getTodayStatusBadge(apt.date, apt.time);
      const photoHtml = apt.photo ? `<img src="${apt.photo}" class="apt-photo" alt="Ảnh khách" onclick="openLightbox('${apt.photo}')" />` : '';
      const noteHtml = apt.note ? `<div class="apt-note">📝 ${escapeHtml(apt.note)}</div>` : '';

      return `
        <div class="apt-card">
          <div class="apt-top">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span class="time-badge">⏰ ${formatTimeVi(apt.time)}</span>
              ${liveBadge}
            </div>
            <span class="service-tag ${srvClass}">${escapeHtml(apt.service)}</span>
          </div>
          <div class="apt-body">
            ${photoHtml}
            <div class="apt-info">
              <div class="customer-name">${escapeHtml(apt.customerName)}</div>
              ${noteHtml}
            </div>
          </div>
          <div class="apt-actions">
            <button class="btn-mini" onclick="editAppointment('${apt.id}')">✏️ Sửa</button>
            <button class="btn-mini danger" onclick="deleteAppointment('${apt.id}')">🗑️ Xoá</button>
          </div>
        </div>
      `;
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('photo-lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('photo-lightbox').classList.remove('open');
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderAllList();
    }

    function renderAllList() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      const todayStr = toDateStr(new Date());

      let filtered = appointments.filter(a => {
        const matchText = !q || a.customerName.toLowerCase().includes(q) || (a.note && a.note.toLowerCase().includes(q));
        if (!matchText) return false;
        if (currentFilter === 'upcoming') return a.date >= todayStr;
        if (currentFilter === 'past') return a.date < todayStr;
        if (currentFilter === 'Makeup') return a.service.includes('Makeup');
        if (currentFilter === 'Nail') return a.service.includes('Nail');
        return true;
      });

      filtered.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      const container = document.getElementById('all-appointments-list');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Không tìm thấy lịch hẹn phù hợp.</div>`;
        return;
      }

      let html = '';
      let lastDate = '';
      filtered.forEach(apt => {
        if (apt.date !== lastDate) {
          lastDate = apt.date;
          const tag = apt.date === todayStr ? ' (Hôm nay)' : '';
          html += `<div class="date-group-label">📅 ${formatDateVi(apt.date)}${tag}</div>`;
        }
        html += renderCardHtml(apt);
      });
      container.innerHTML = html;
    }

    function selectService(srv, el) {
      selectedService = srv;
      document.querySelectorAll('.srv-opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }

    function setQuickTime(t) {
      document.getElementById('inp-time').value = t;
      checkOverlapWarning();
    }

    function checkOverlapWarning() {
      const date = document.getElementById('inp-date').value;
      const time = document.getElementById('inp-time').value;
      const editId = document.getElementById('edit-id').value;
      const alertEl = document.getElementById('overlap-alert');

      if (!date || !time) {
        alertEl.style.display = 'none';
        return;
      }

      const targetMins = getMinutes(time);
      const conflict = appointments.find(a => a.date === date && a.id !== editId && Math.abs(getMinutes(a.time) - targetMins) < 45);
      if (conflict) {
        alertEl.textContent = `⚠️ Lưu ý: Ngày này đã có khách ${conflict.customerName} đặt lúc ${conflict.time} (${conflict.service})`;
        alertEl.style.display = 'block';
      } else {
        alertEl.style.display = 'none';
      }
    }

    function openModal() {
      document.getElementById('modal-title').textContent = 'Thêm Lịch Đặt Mới';
      document.getElementById('edit-id').value = '';
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-date').value = selectedDateStr;
      document.getElementById('inp-time').value = '09:00';
      document.getElementById('inp-note').value = '';
      document.getElementById('inp-photo').value = '';
      currentPhotoBase64 = '';
      document.getElementById('photo-preview').style.display = 'none';
      selectService('Makeup', document.querySelector('.srv-opt[data-srv="Makeup"]'));
      checkOverlapWarning();
      document.getElementById('apt-modal').classList.add('open');
    }

    function editAppointment(id) {
      const apt = appointments.find(a => a.id === id);
      if (!apt) return;
      document.getElementById('modal-title').textContent = 'Sửa Lịch Hẹn';
      document.getElementById('edit-id').value = apt.id;
      document.getElementById('inp-name').value = apt.customerName;
      document.getElementById('inp-date').value = apt.date;
      document.getElementById('inp-time').value = apt.time;
      document.getElementById('inp-note').value = apt.note || '';
      currentPhotoBase64 = apt.photo || '';
      const prev = document.getElementById('photo-preview');
      if (currentPhotoBase64) {
        prev.src = currentPhotoBase64;
        prev.style.display = 'block';
      } else {
        prev.style.display = 'none';
      }
      const opt = document.querySelector(`.srv-opt[data-srv="${apt.service}"]`) || document.querySelector('.srv-opt');
      selectService(apt.service, opt);
      checkOverlapWarning();
      document.getElementById('apt-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('apt-modal').classList.remove('open');
    }

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 480;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
          const prev = document.getElementById('photo-preview');
          prev.src = currentPhotoBase64;
          prev.style.display = 'block';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveAppointment() {
      const name = document.getElementById('inp-name').value.trim();
      const date = document.getElementById('inp-date').value;
      const time = document.getElementById('inp-time').value;
      const note = document.getElementById('inp-note').value.trim();
      const editId = document.getElementById('edit-id').value;

      if (!name || !date || !time) {
        alert('Vui lòng nhập đầy đủ Tên khách, Ngày đặt và Giờ hẹn!');
        return;
      }

      if (editId) {
        const idx = appointments.findIndex(a => a.id === editId);
        if (idx !== -1) {
          appointments[idx] = { ...appointments[idx], customerName: name, date, time, service: selectedService, note, photo: currentPhotoBase64 };
        }
      } else {
        appointments.push({
          id: 'apt_' + Date.now(),
          customerName: name,
          date,
          time,
          service: selectedService,
          note,
          photo: currentPhotoBase64
        });
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
      selectedDateStr = date;
      const [y, m] = date.split('-').map(Number);
      viewYear = y;
      viewMonth = m - 1;

      closeModal();
      renderCalendar();
      renderDayAppointments();
      renderAllList();
      updateCoverSummary();
      syncIosNotifications();
    }

    function deleteAppointment(id) {
      if (!confirm('Bạn có chắc muốn xoá lịch hẹn này không?')) return;
      appointments = appointments.filter(a => a.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
      renderCalendar();
      renderDayAppointments();
      renderAllList();
      updateCoverSummary();
      syncIosNotifications();
    }

    function saveSettings() {
      settings.enableExactTime = document.getElementById('enable-exact').checked;
      settings.remindBeforeMinutes = Number(document.getElementById('remind-minutes').value);
      settings.enableDailySummary = document.getElementById('enable-summary').checked;
      settings.summaryTime = document.getElementById('summary-time').value || '21:00';
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      syncIosNotifications();
    }

    window.onIosPendingCount = function(count) {
      const badge = document.getElementById('ios-pending-badge');
      if (badge) badge.textContent = `Đã hẹn giờ: ${count} thông báo`;
    };

    function syncIosNotifications() {
      const [h, m] = (settings.summaryTime || '21:00').split(':').map(Number);
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosNotify) {
        window.webkit.messageHandlers.iosNotify.postMessage({
          action: 'syncNotifications',
          enableExactTime: settings.enableExactTime,
          remindBeforeMinutes: settings.remindBeforeMinutes,
          enableDailySummary: settings.enableDailySummary,
          dailySummaryHour: h,
          dailySummaryMinute: m,
          appointments: appointments.map(a => ({
            id: a.id,
            date: a.date,
            time: a.time,
            customerName: a.customerName,
            service: a.service,
            note: a.note || ''
          }))
        });
      } else {
        const badge = document.getElementById('ios-pending-badge');
        if (badge) badge.textContent = 'Sẵn sàng trên iOS';
      }
    }

    function sendTestNotification() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosNotify) {
        window.webkit.messageHandlers.iosNotify.postMessage({ action: 'testNotification' });
        alert('Đã đặt lịch thử! Hãy khoá màn hình iPhone lại ngay, sau 5 giây popup thông báo sẽ hiện lên.');
      } else {
        alert('Chức năng này hoạt động khi cài app IPA lên iPhone.');
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }

    // Khởi tạo
    applyTheme(isDark);
    document.getElementById('header-date-sub').textContent = formatDateVi(toDateStr(new Date()));
    document.getElementById('enable-exact').checked = settings.enableExactTime;
    document.getElementById('remind-minutes').value = settings.remindBeforeMinutes;
    document.getElementById('enable-summary').checked = settings.enableDailySummary;
    document.getElementById('summary-time').value = settings.summaryTime;

    updateCoverSummary();
    renderCalendar();
    renderDayAppointments();
    syncIosNotifications();
  </script>
</body>
</html>
