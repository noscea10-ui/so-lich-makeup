                  } else if action == "callPhone" {
                      if let phone = dict["phone"] as? String, let url = URL(string: "tel://\(phone)") {
                          DispatchQueue.main.async {
                              UIApplication.shared.open(url, options: [:], completionHandler: nil)
                          }
                      }
                  }
              }
              private func syncAllAppointments(_ dict: [String: Any]) {
                  let center = UNUserNotificationCenter.current()
                  center.requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
                  center.removeAllPendingNotificationRequests()
                  guard let list = dict["appointments"] as? [[String: Any]] else { return }
                  let enableExact = dict["enableExactTime"] as? Bool ?? true
                  let remindBefore = dict["remindBeforeMinutes"] as? Int ?? 30
                  let enableSummary = dict["enableDailySummary"] as? Bool ?? true
                  let summaryHour = dict["dailySummaryHour"] as? Int ?? 21
                  let summaryMinute = dict["dailySummaryMinute"] as? Int ?? 0
                  let nowSec = Date().timeIntervalSince1970
                  let posixLocale = Locale(identifier: "en_US_POSIX")
                  let dayFormatter = DateFormatter()
                  dayFormatter.locale = posixLocale
                  dayFormatter.dateFormat = "yyyy-MM-dd"
                  dayFormatter.timeZone = TimeZone.current
                  let calendar = Calendar.current
                  var groupedByDate: [String: [[String: Any]]] = [:]
                  for item in list {
                      guard let id = item["id"] as? String, let dateStr = item["date"] as? String, let timeStr = item["time"] as? String, let name = item["customerName"] as? String, let service = item["service"] as? String else { continue }
                      let note = item["note"] as? String ?? ""
                      let locType = item["locationType"] as? String ?? "studio"
                      let address = item["address"] as? String ?? ""
                      let locText = locType == "home" ? "🛵 Đến nhà khách" : "🏠 Tại tiệm"
                      let addrSuffix = (locType == "home" && !address.isEmpty) ? " • Đ/c: \(address)" : ""
                      let noteSuffix = note.isEmpty ? "" : " — \(note)"
                      groupedByDate[dateStr, default: []].append(item)
                      var exactSec: Double = 0
                      if let ms = item["exactTimestampMs"] as? Double {
                          exactSec = ms / 1000.0
                      } else if let msInt = item["exactTimestampMs"] as? Int64 {
                          exactSec = Double(msInt) / 1000.0
                      }
                      if exactSec <= 0 { continue }
                      let diffExact = exactSec - nowSec
                      if remindBefore > 0 {
                          let diffRemind = diffExact - Double(remindBefore * 60)
                          if diffRemind > 2 {
                              let content = UNMutableNotificationContent()
                              content.title = "⏳ \(remindBefore)p nữa (\(timeStr)) • [\(locText)]"
                              content.body = "\(name) • \(service)\(addrSuffix)\(noteSuffix)"
                              content.sound = .default
                              if #available(iOS 15.0, *) { content.interruptionLevel = .timeSensitive }
                              let trigger = UNTimeIntervalNotificationTrigger(timeInterval: diffRemind, repeats: false)
                              center.add(UNNotificationRequest(identifier: "apt-remind-\(id)", content: content, trigger: trigger))
                          }
                      }
                      if enableExact {
                          if diffExact > 2 {
                              let contentExact = UNMutableNotificationContent()
                              contentExact.title = "🔔 ĐẾN GIỜ LÀM (\(timeStr)) • [\(locText)]"
                              contentExact.body = "\(name) • \(service) đã tới giờ hẹn!\(addrSuffix)\(noteSuffix)"
                              contentExact.sound = .default
                              if #available(iOS 15.0, *) { contentExact.interruptionLevel = .timeSensitive }
                              let triggerExact = UNTimeIntervalNotificationTrigger(timeInterval: diffExact, repeats: false)
                              center.add(UNNotificationRequest(identifier: "apt-exact-\(id)", content: contentExact, trigger: triggerExact))
                          } else if diffExact >= -55 && diffExact <= 2 {
                              let contentNow = UNMutableNotificationContent()
                              contentNow.title = "🔔 ĐẾN GIỜ LÀM (\(timeStr)) • [\(locText)]"
                              contentNow.body = "\(name) • \(service) đã tới giờ hẹn!\(addrSuffix)\(noteSuffix)"
                              contentNow.sound = .default
                              if #available(iOS 15.0, *) { contentNow.interruptionLevel = .timeSensitive }
                              let triggerNow = UNTimeIntervalNotificationTrigger(timeInterval: 3, repeats: false)
                              center.add(UNNotificationRequest(identifier: "apt-exact-now-\(id)", content: contentNow, trigger: triggerNow))
                          }
                      }
                  }
                  if enableSummary {
                      for (dateStr, items) in groupedByDate {
                          guard let targetDay = dayFormatter.date(from: dateStr), let eveningBefore = calendar.date(byAdding: .day, value: -1, to: targetDay) else { continue }
                          var comps = calendar.dateComponents([.year, .month, .day], from: eveningBefore)
                          comps.hour = summaryHour
                          comps.minute = summaryMinute
                          if let fireDate = calendar.date(from: comps), fireDate.timeIntervalSince1970 > nowSec {
                              let sorted = items.sorted { ($0["time"] as? String ?? "") < ($1["time"] as? String ?? "") }
                              let lines = sorted.map { item -> String in
                                  let loc = (item["locationType"] as? String) == "home" ? "🛵Tận nhà" : "🏠Tiệm"
                                  return "\(item["time"] ?? "") • \(item["customerName"] ?? "") (\(item["service"] ?? "") - \(loc))"
                              }
                              let content = UNMutableNotificationContent()
                              content.title = "📅 Ngày mai có \(items.count) khách đặt lịch"
                              content.body = lines.joined(separator: "\n")
                              content.sound = .default
                              if #available(iOS 15.0, *) { content.interruptionLevel = .timeSensitive }
                              let trigger = UNCalendarNotificationTrigger(dateMatching: comps, repeats: false)
                              center.add(UNNotificationRequest(identifier: "summary-\(dateStr)", content: content, trigger: trigger))
                          }
                      }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.35) {
                      center.getPendingNotificationRequests { requests in
                          DispatchQueue.main.async {
                              self.webView?.evaluateJavaScript("if(window.onIosPendingCount){window.onIosPendingCount(\(requests.count));}", completionHandler: nil)
                          }
                      }
                  }
              }
          }
          struct WebViewContainer: UIViewRepresentable {
              func makeCoordinator() -> NotificationBridge { NotificationBridge() }
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.defaultWebpagePreferences.allowsContentJavaScript = true
                  config.websiteDataStore = .default()
                  config.preferences.setValue(true, forKey: "allowFileAccessFromFileURLs")
                  config.userContentController.add(context.coordinator, name: "iosNotify")
                  let webView = WKWebView(frame: .zero, configuration: config)
                  context.coordinator.webView = webView
                  webView.navigationDelegate = context.coordinator
                  webView.scrollView.bounces = false
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.07, green: 0.05, blue: 0.05, alpha: 1.0)
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }
          @main
          struct KimNganStudioApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              var body: some Scene {
                  WindowGroup {
                      WebViewContainer().ignoresSafeArea(.all)
                  }
              }
          }
          EOF
          cat << 'EOF' > project.yml
          name: KimNganStudio
          options:
            bundleIdPrefix: com.kent
            deploymentTarget:
              iOS: "15.0"
          targets:
            KimNganStudio:
              type: application
              platform: iOS
              sources:
                - path: AppSource
                - path: Assets.xcassets
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kent.kimnganstudio
                  INFOPLIST_KEY_CFBundleDisplayName: "Kim Ngân Studio"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Cho phep chon anh khach hang va mau nail makeup"
                  INFOPLIST_KEY_NSCameraUsageDescription: "Cho phep chup anh khach hang va mau nail makeup"
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF
          xcodegen generate
      - name: Build Unsigned .app via Xcode
        run: |
          xcodebuild -project KimNganStudio.xcodeproj -scheme KimNganStudio -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES clean build
      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "KimNganStudio.app" -type d | head -n 1)
          if [ ! -f "$APP_PATH/index.html" ]; then
            echo "LOI: Khong tim thay index.html trong goi ung dung!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r KimNganStudio-Unsigned.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KimNganStudio-IPA
          path: KimNganStudio-Unsigned.ipa
